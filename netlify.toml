# Build settings live here rather than in the Netlify UI so they stay in sync
# with the repo.
#
# This project uses npm, and only npm: package.json pins "packageManager" to
# npm and package-lock.json is the committed lockfile. A stale pnpm-lock.yaml
# used to sit alongside it and broke this build (it pinned next 15.x against a
# package.json requiring 16.2.12); it has been removed.

[build]
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node >= 20.9.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
